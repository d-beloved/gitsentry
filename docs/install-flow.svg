<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gitsentry.dev install flow</title>
  <desc id="desc">Three-step install flow: install GitHub App, open a pull request, receive security findings.</desc>
  <rect width="960" height="420" rx="30" fill="#070A08"/>
  <circle cx="820" cy="-20" r="220" fill="#37FF8B" fill-opacity=".08"/>
  <circle cx="80" cy="420" r="180" fill="#37FF8B" fill-opacity=".06"/>
  <g transform="translate(60 56)">
    <rect width="840" height="308" rx="26" fill="#0D1410" stroke="#1E3C2B"/>
    <text x="38" y="58" fill="#F5FFF8" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="34" font-weight="800">From install to first finding</text>
    <text x="40" y="88" fill="#7D9889" font-family="Cascadia Code, Source Code Pro, monospace" font-size="14">GITSENTRY.DEV WEBHOOK SMOKE TEST</text>
    <g transform="translate(42 132)">
      <rect width="210" height="120" rx="18" fill="#08110C" stroke="#37FF8B" stroke-opacity=".45"/>
      <text x="24" y="40" fill="#37FF8B" font-family="Cascadia Code, Source Code Pro, monospace" font-size="13">01</text>
      <text x="24" y="72" fill="#F5FFF8" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="22" font-weight="700">Install app</text>
      <text x="24" y="98" fill="#88A193" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="14">Select repos and save.</text>
    </g>
    <path d="M282 192H334" stroke="#37FF8B" stroke-width="4" stroke-linecap="round"/>
    <path d="M326 182L338 192L326 202" stroke="#37FF8B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(368 132)">
      <rect width="210" height="120" rx="18" fill="#08110C" stroke="#37FF8B" stroke-opacity=".45"/>
      <text x="24" y="40" fill="#37FF8B" font-family="Cascadia Code, Source Code Pro, monospace" font-size="13">02</text>
      <text x="24" y="72" fill="#F5FFF8" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="22" font-weight="700">Open PR</text>
      <text x="24" y="98" fill="#88A193" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="14">Webhook fetches the diff.</text>
    </g>
    <path d="M608 192H660" stroke="#37FF8B" stroke-width="4" stroke-linecap="round"/>
    <path d="M652 182L664 192L652 202" stroke="#37FF8B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(694 132)">
      <rect width="106" height="120" rx="18" fill="#37FF8B"/>
      <text x="20" y="42" fill="#041008" font-family="Cascadia Code, Source Code Pro, monospace" font-size="13">03</text>
      <text x="20" y="73" fill="#041008" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="22" font-weight="800">Fix</text>
      <text x="20" y="99" fill="#10351F" font-family="Avenir Next, Manrope, Verdana, sans-serif" font-size="14">Comment</text>
    </g>
  </g>
</svg>
